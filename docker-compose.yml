version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: techdeliver-db
    environment:
      POSTGRES_DB: techdeliver
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./server
    container_name: techdeliver-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/techdeliver
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: techdeliver-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
